server.port=${PORT:8080}
spring.application.name=JobPortal
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=mongodb://localhost:27017/jobportal
#spring.data.mongodb.uri=mongodb+srv://rinit:${MONGO_PASSWORD}@jobportal.hxihdgz.mongodb.net/jobportal?retryWrites=true&w=majority&appName=Jobportal

# Spring Boot Performance Optimizations for Render
spring.main.lazy-initialization=true
spring.jmx.enabled=false
server.tomcat.threads.max=50

# Multipart / File Upload (for PDF resume parsing)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI Configuration (Groq) - Get your free key at https://console.groq.com/keys
# Free tier: 14,400 requests/day, 30 requests/minute
groq.api.key=${GROQ_API_KEY}




#Email Properties
spring.mail.host=smtp.resend.com
spring.mail.port=2525
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



#Exception Messages

USER_FOUND= Email registered already.
USER_NOT_FOUND = User is not registered.
INVALID_CREDENTIALS= Invalid Credentials.
PROFILE_NOT_FOUND=Profile not found.

OTP_NOT_FOUND=OTP has been expired.
OTP_INCORRECT=OTP is incorrect.

JOB_NOT_FOUND=Job not found.
JOB_APPLIED_ALREADY=Already Applied to this Job.
APPLICANT_NOT_FOUND=Applicant not found.

